name: Build installers

# Si attiva quando cambia version.txt su main (o manualmente)
on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Librerie di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Lettura versione
        id: version
        run: echo "value=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name FindDocument
          --paths src
          --add-data "version.txt:."
          --add-data "src/find_document/gui/resources:find_document/gui/resources"
          --collect-data docx --collect-data pptx
          src/main.py

      - name: Installer Windows (NSIS)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null; then choco install nsis -y; export PATH="$PATH:/c/Program Files (x86)/NSIS"; fi
          makensis -DVERSION=${{ steps.version.outputs.value }} -DSOURCE_DIR=../dist/FindDocument installer/find_document.nsi
      - name: Pacchetto macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/FindDocument.app "dist/FindDocument-${{ steps.version.outputs.value }}-macos.zip"
      - name: Pacchetto Linux
        if: runner.os == 'Linux'
        run: tar -czf "dist/FindDocument-${{ steps.version.outputs.value }}-linux.tar.gz" -C dist FindDocument

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/FindDocument-Setup-*.exe
            dist/FindDocument-*-macos.zip
            dist/FindDocument-*-linux.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lettura versione
        id: version
        run: echo "value=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Find Document ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: artifacts/*
